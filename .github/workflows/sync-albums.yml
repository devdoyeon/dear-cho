# Spotify에서 앨범 데이터를 주기적으로 동기화하고 사이트를 재배포하는 워크플로

# 사전 준비 (도연님):
#   1. Spotify 개발자 앱 등록 → Client ID / Secret 발급
#   2. 저장소 Settings > Secrets and variables > Actions 에 아래 3개 등록
#        SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET / SPOTIFY_ARTIST_IDS
#   3. 처음엔 Actions 탭에서 "Run workflow"(workflow_dispatch)로 수동 실행해 결과 확인 권장
#
# 주의: 이 워크플로는 기본 브랜치(master) 기준으로 albumData.json을 갱신·커밋합니다.
#       배포 흐름(gh-pages)을 바꾸고 싶지 않으면 아래 deploy 스텝을 제거하고
#       기존처럼 로컬에서 npm run deploy 를 쓰셔도 됩니다.

name: Sync albums from Spotify

on:
  schedule:
    - cron: '0 0 * * 1' # 매주 월요일 00:00 UTC
  workflow_dispatch: {} # 수동 실행

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Fetch Spotify discography
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_ARTIST_IDS: ${{ secrets.SPOTIFY_ARTIST_IDS }}
        run: npm run sync:albums

      - name: Commit updated albumData
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/albumData.json
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋/배포 스킵"
            echo "changed=false" >> "$GITHUB_ENV"
          else
            git commit -m "chore: Spotify 앨범 데이터 자동 동기화"
            git push
            echo "changed=true" >> "$GITHUB_ENV"
          fi

      - name: Build
        if: env.changed == 'true'
        run: npm run build

      - name: Deploy to GitHub Pages
        if: env.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          cname: dear-cho.site
